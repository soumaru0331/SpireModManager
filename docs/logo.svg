<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ツミキ: 積み木を少しずつずらして積み上げた塔（スパイア）。暗い紋章の中で、てっぺんが赤く灯る -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="72%">
      <stop offset="0" stop-color="#5a1f17"/>
      <stop offset=".5" stop-color="#211512"/>
      <stop offset="1" stop-color="#0e0a09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe6a3"/>
      <stop offset=".45" stop-color="#ebb04c"/>
      <stop offset="1" stop-color="#a5661f"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08f"/>
      <stop offset="1" stop-color="#93591b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff7448" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ff3b22" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff3b22" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="33" r="29.5" fill="url(#bg)" stroke="url(#rim)" stroke-width="3"/>
  <circle cx="32" cy="33" r="26.1" fill="none" stroke="#000" stroke-opacity=".55" stroke-width="1.2"/>
  <circle cx="31.5" cy="14" r="14" fill="url(#glow)"/>
  <g stroke="#140d0a" stroke-width="1.8" stroke-linejoin="round" fill="url(#gold)">
    <path d="M14.8 46.2 L45.4 45.4 L46 55.4 L14.6 55.6 Z"/>
    <path d="M21.4 37.2 L47 36.6 L47.2 45.6 L21.6 46.2 Z"/>
    <path d="M17.6 29.4 L39.2 29.8 L39.4 37.4 L17.4 37.6 Z"/>
    <path d="M24.6 22 L39.4 21.6 L39.6 29.8 L24.4 29.6 Z"/>
    <path d="M31.4 4.6 L38.6 21.8 L24.6 22 Z"/>
  </g>
  <!-- 影（下側） -->
  <g fill="#000" opacity=".3">
    <path d="M14.7 52.8 L45.8 52.5 L46 55.4 L14.6 55.6 Z"/>
    <path d="M21.5 43.2 L47.1 42.9 L47.2 45.6 L21.6 46.2 Z"/>
    <path d="M17.5 35 L39.3 34.9 L39.4 37.4 L17.4 37.6 Z"/>
    <path d="M24.5 27.1 L39.5 27.1 L39.6 29.8 L24.4 29.6 Z"/>
    <path d="M34.6 12.2 L38.6 21.8 L32.2 21.9 Z"/>
  </g>
  <!-- てっぺんの赤い灯 -->
  <path d="M31.4 0.6 L33.4 4.2 L31.4 7.8 L29.4 4.2 Z" fill="#ff5a36" stroke="#140d0a" stroke-width="1.1" stroke-linejoin="round"/>
</svg>
